site_name: Orca LLM Wiki
docs_dir: docs
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search:
      lang: zh
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - 首页: README.md
  - Worktree 编排:
      - worktree-orchestration/01-概览与架构.md
      - worktree-orchestration/02-创建管线.md
      - worktree-orchestration/03-预备池.md
      - worktree-orchestration/04-删除管线与安全护栏.md
      - worktree-orchestration/05-身份命名与持久化.md
      - worktree-orchestration/06-设计模式与原则.md
  - Agent 生命周期:
      - agent-lifecycle/01-概览与架构.md
      - agent-lifecycle/02-hook摄取管线.md
      - agent-lifecycle/03-状态词表与三态语义.md
      - agent-lifecycle/04-生命周期状态机.md
      - agent-lifecycle/05-并发护栏与跨主机边界.md
      - agent-lifecycle/06-读者呈现与演进史.md
  - SSH / 远程执行边界:
      - ssh-remote-execution/01-概览与拓扑.md
      - ssh-remote-execution/02-host标识与操作路由.md
      - ssh-remote-execution/03-连接生命周期与重连.md
      - ssh-remote-execution/04-失联语义与对账.md
      - ssh-remote-execution/05-wire协议与版本混布.md
      - ssh-remote-execution/06-部署与上传链.md
      - ssh-remote-execution/07-测试地图与故障案例库.md
  - 终端 / PTY 子系统:
      - terminal-pty/01-概览与架构.md
      - terminal-pty/02-daemon生命周期.md
      - terminal-pty/03-pty层.md
      - terminal-pty/04-shell-wrapper体系.md
      - terminal-pty/05-scrollback与恢复.md
      - terminal-pty/06-终端与agent交互.md
      - terminal-pty/07-平台专章与设计原则.md
